name: Ultimate Minimal - Tailscale + VNC

on:
  workflow_dispatch:

jobs:
  secure-vnc:
    runs-on: windows-2022
    timeout-minutes: 350

    steps:
      - name: Disable Firewall & Defender
        run: |
          Set-MpPreference -DisableRealtimeMonitoring $true
          Set-NetFirewallProfile -Profile Domain,Public,Private -Enabled False
          Stop-Service wuauserv -Force
          Set-Service wuauserv -StartupType Disabled

      - name: Install & Configure TightVNC Server
        run: |
          # Install TightVNC (Only ~3MB)
          choco install tightvnc -y
          Start-Sleep -Seconds 5
          
          # Disable authentication to allow direct login
          if (-not (Test-Path "HKLM:\Software\TightVNC\Server")) { New-Item -Path "HKLM:\Software\TightVNC\Server" -Force | Out-Null }
          Set-ItemProperty -Path "HKLM:\Software\TightVNC\Server" -Name "UseVncAuthentication" -Value 0 -Type DWord -Force
          Set-ItemProperty -Path "HKLM:\Software\TightVNC\Server" -Name "UseControlAuthentication" -Value 0 -Type DWord -Force
          
          # Start TightVNC Server in the background
          Start-Process -FilePath "C:\Program Files\TightVNC\tvnserver.exe" -ArgumentList "-run" -NoNewWindow
          Start-Sleep -Seconds 3

      - name: Install Tailscale
        run: |
          $tsUrl = "https://pkgs.tailscale.com/stable/tailscale-setup-latest.exe"
          $installerPath = "$env:TEMP\tailscale-setup.exe"
          Invoke-WebRequest -Uri $tsUrl -OutFile $installerPath
          Start-Process -FilePath $installerPath -ArgumentList "/quiet" -Wait
          Remove-Item $installerPath -Force
          Start-Sleep -Seconds 5

      - name: Establish Tailscale Connection
        run: |
          & "$env:ProgramFiles\Tailscale\tailscale.exe" up --authkey=${{ secrets.TAILSCALE_AUTHKEY }} --hostname=gh-runner-$env:GITHUB_RUN_ID --accept-dns=false
          $tsIP = $null
          $retries = 0
          while (-not $tsIP -and $retries -lt 10) {
              $tsIP = & "$env:ProgramFiles\Tailscale\tailscale.exe" ip -4
              Start-Sleep -Seconds 5
              $retries++
          }
          if (-not $tsIP) { Write-Host "Failed to get Tailscale IP!" }
          echo "TAILSCALE_IP=$tsIP" >> $env:GITHUB_ENV

      - name: Access Info
        run: |
          Write-Host "`n=== DIRECT VNC OVER TAILSCALE ==="
          Write-Host "Tailscale IP: $env:TAILSCALE_IP"
          Write-Host "How to connect:"
          Write-Host "1. Download VNC Viewer on your laptop (like RealVNC or TightVNC Viewer)."
          Write-Host "2. Enter the Tailscale IP above."
          Write-Host "3. Press Connect (No password required!)."
          Write-Host "====================================`n"
          
          while ($true) { Start-Sleep -Seconds 300 }
