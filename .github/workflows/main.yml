name: Browser RDP - noVNC Web Access

on:
  workflow_dispatch:

jobs:
  novnc-runner:
    runs-on: windows-2022
    timeout-minutes: 350

    steps:
      - name: Disable Firewall & Defender
        run: |
          Set-MpPreference -DisableRealtimeMonitoring $true
          Set-NetFirewallProfile -Profile Domain,Public,Private -Enabled False
          Stop-Service wuauserv -Force
          Set-Service wuauserv -StartupType Disabled

      - name: Install TigerVNC Server
        run: |
          choco install tigervnc -y
          Start-Sleep -Seconds 5
          # Start VNC Server (tvnserver) in the background
          Start-Process -FilePath "C:\Program Files\TigerVNC\tvnserver.exe" -NoNewWindow

      - name: Setup noVNC & Websockify
        run: |
          # Python is already installed on Windows GitHub runners
          pip install websockify
          
          # Download and extract noVNC
          Invoke-WebRequest -Uri "https://github.com/novnc/noVNC/archive/refs/tags/v1.4.0.zip" -OutFile "C:\novnc.zip"
          Expand-Archive -Path "C:\novnc.zip" -DestinationPath "C:\novnc_folder"
          
          # Start websockify: Listens on port 6080, translates to VNC on 5900, serves noVNC web interface
          $novncPath = "C:\novnc_folder\noVNC-1.4.0"
          Start-Process -FilePath "websockify" -ArgumentList "6080 localhost:5900 --web $novncPath" -NoNewWindow
          Start-Sleep -Seconds 5

      - name: Expose with Cloudflare Tunnel & Generate Web Link
        run: |
          choco install cloudflared -y
          
          # Start Cloudflare tunnel and redirect outputs to separate files
          Start-Process -FilePath "cloudflared" -ArgumentList "tunnel --url http://localhost:6080" -RedirectStandardOutput "C:\tunnel_out.log" -RedirectStandardError "C:\tunnel_err.log" -NoNewWindow
          Start-Sleep -Seconds 12
          
          Write-Host "`n=== DIRECT BROWSER ACCESS LINK ==="
          Write-Host "Please wait a moment while the secure link is generated..."
          
          # Cloudflared writes the tunnel URL to Standard Error (tunnel_err.log)
          $cfLink = Get-Content "C:\tunnel_err.log" | Select-String "trycloudflare.com" | Select-Object -First 1
          
          if ($cfLink) {
              $url = [regex]::Match($cfLink, 'https://[a-zA-Z0-9-]+\.trycloudflare\.com').Value
              Write-Host "Click this link to access your Windows Server from the browser:"
              Write-Host ">> $url <<"
          } else {
              Write-Host "Could not retrieve the link automatically. Please check C:\tunnel_err.log manually."
              Get-Content "C:\tunnel_err.log"
          }
          Write-Host "======================================`n"

      - name: Keep Server Alive
        run: while ($true) { Start-Sleep -Seconds 300 }
