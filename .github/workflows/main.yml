name: Ultimate Gaming - Tailscale + Portable RustDesk

on:
  workflow_dispatch:

jobs:
  secure-remote:
    runs-on: windows-2022
    timeout-minutes: 350

    steps:
      - name: GPU Acceleration Override & Strip Bloatware
        run: |
          Set-ItemProperty -Path "HKLM:\SOFTWARE\Microsoft\Windows\Dwm" -Name "EnableMachineAnimations" -Value 0
          Set-ItemProperty -Path "HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\VisualEffects" -Name "VisualFXSetting" -Value 2
          Set-MpPreference -DisableRealtimeMonitoring $true
          if (-not (Test-Path "HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender")) { New-Item -Path "HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender" -Force | Out-Null }
          Set-ItemProperty -Path "HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender" -Name "DisableAntiSpyware" -Value 1
          Stop-Service wuauserv -Force
          Set-Service wuauserv -StartupType Disabled
          powercfg -setactive 8c5e7fda-e8bf-4a96-9a85-a6e23a8c635c
          Set-NetFirewallProfile -Profile Domain,Public,Private -Enabled False

      - name: Enable Windows Audio & RDP Backup
        run: |
          Set-Service -Name Audiosrv -StartupType Automatic
          Start-Service -Name Audiosrv
          choco install vb-cable -y --ignore-checksums
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -name "fDenyTSConnections" -value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-LocalUser -Name "runneradmin" -Password (ConvertTo-SecureString -AsPlainText "Familia2026!" -Force)

      - name: Install Tailscale
        run: |
          $tsUrl = "https://pkgs.tailscale.com/stable/tailscale-setup-latest.exe"
          $installerPath = "$env:TEMP\tailscale-setup.exe"
          Invoke-WebRequest -Uri $tsUrl -OutFile $installerPath
          Start-Process -FilePath $installerPath -ArgumentList "/quiet" -Wait
          Remove-Item $installerPath -Force

      - name: Establish Tailscale Connection
        run: |
          & "$env:ProgramFiles\Tailscale\tailscale.exe" up --authkey=${{ secrets.TAILSCALE_AUTHKEY }} --hostname=gh-runner-$env:GITHUB_RUN_ID
          $tsIP = $null
          $retries = 0
          while (-not $tsIP -and $retries -lt 10) {
              $tsIP = & "$env:ProgramFiles\Tailscale\tailscale.exe" ip -4
              Start-Sleep -Seconds 5
              $retries++
          }
          echo "TAILSCALE_IP=$tsIP" >> $env:GITHUB_ENV

      - name: Start RustDesk Portable (No Install)
        run: |
          Invoke-WebRequest -Uri "https://github.com/rustdesk/rustdesk/releases/download/1.2.3/rustdesk-1.2.3-x86_64.exe" -OutFile "C:\rustdesk.exe"
          Start-Process -FilePath "C:\rustdesk.exe" -ArgumentList "--password Familia2026!" -NoNewWindow
          Start-Sleep -Seconds 5

      - name: Maintain Connection & Show Access Info
        run: |
          Write-Host "`n=== DIRECT ACCESS OVER TAILSCALE ==="
          Write-Host "Tailscale IP: $env:TAILSCALE_IP"
          Write-Host "Password (for both): Familia2026!"
          Write-Host "Option 1: RustDesk (Enter Tailscale IP in your local RustDesk)"
          Write-Host "Option 2: Normal Windows RDP (Enter Tailscale IP in Remote Desktop)"
          Write-Host "====================================`n"
          
          while ($true) { Start-Sleep -Seconds 300 }
