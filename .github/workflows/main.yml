name: RDP

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Optimize CPU, Fix Desync, Speedup RDP & Get Mesa3D
        shell: powershell
        run: |
          # 1. Paralyze Defender INSTANTLY to save CPU (NO HANGING)
          Set-MpPreference -DisableRealtimeMonitoring $true -ErrorAction SilentlyContinue
          Set-MpPreference -DisableBehaviorMonitoring $true -ErrorAction SilentlyContinue
          
          # 2. Ultimate Performance Power Plan & Visual Tweaks
          powercfg -setactive 8c5e7fda-e8bf-4a96-9a85-a6e23a8c635c
          Set-ItemProperty -Path "HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\VisualEffects" -Name "VisualFXSetting" -Value 2
          
          # 3. KIll Bloatware Services
          Stop-Service -Name "DiagTrack" -Force -ErrorAction SilentlyContinue
          Set-Service -Name "DiagTrack" -StartupType Disabled -ErrorAction SilentlyContinue
          Stop-Service -Name "SysMain" -Force -ErrorAction SilentlyContinue
          Set-Service -Name "SysMain" -StartupType Disabled -ErrorAction SilentlyContinue

          # 4. FIX DESYNC: Prioritize Multimedia and Games over Network bandwidth
          $mmcss = "HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Multimedia\SystemProfile"
          if (!(Test-Path $mmcss)) { New-Item -Path $mmcss -Force | Out-Null }
          Set-ItemProperty -Path $mmcss -Name "NetworkThrottlingIndex" -Value 0xffffffff -Type DWord
          Set-ItemProperty -Path $mmcss -Name "SystemResponsiveness" -Value 10 -Type DWord

          # 5. RDP SPEEDUP: Unlock H.264, 444, and Force 60 FPS for "طلقة" speed!
          $rdpPolicy = "HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services"
          if (!(Test-Path $rdpPolicy)) { New-Item -Path $rdpPolicy -Force | Out-Null }
          Set-ItemProperty -Path $rdpPolicy -Name "bEnableH264Codec" -Value 1 -Type DWord
          Set-ItemProperty -Path $rdpPolicy -Name "bEnableH264Codec444" -Value 1 -Type DWord
          Set-ItemProperty -Path $rdpPolicy -Name "MaxMonitors" -Value 1 -Type DWord
          
          $rdpTcp = "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp"
          if (!(Test-Path $rdpTcp)) { New-Item -Path $rdpTcp -Force | Out-Null }
          Set-ItemProperty -Path $rdpTcp -Name "MaxFrameRate" -Value 60 -Type DWord

          # 6. Safely Download and Extract Mesa3D to C:\Mesa3D (No crashes, No Setup Script)
          Write-Host "Downloading Mesa3D safely..."
          Invoke-WebRequest -Uri "https://github.com/pal1000/mesa-dist-win/releases/download/23.1.9/mesa3d-23.1.9-release-msvc.7z" -OutFile "C:\mesa.7z"
          Write-Host "Extracting to C:\Mesa3D..."
          & "7z.exe" x "C:\mesa.7z" -o"C:\Mesa3D" -y
          Remove-Item "C:\mesa.7z" -Force
          Write-Host "Optimization Complete! Mesa3D is ready at C:\Mesa3D"

      - name: Configure Core RDP Settings
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "SecurityLayer" -Value 0 -Force
          netsh advfirewall firewall delete rule name="RDP-Tailscale" 2>$null
          netsh advfirewall firewall add rule name="RDP-Tailscale" dir=in action=allow protocol=TCP localport=3389
          Restart-Service -Name TermService -Force

      - name: Create RDP User with Secure Credentials
        shell: powershell
        env:
          RDP_USER: ${{ secrets.RDP_USERNAME }}
          RDP_PASS: ${{ secrets.RDP_PASSWORD }}
        run: |
          $username = $env:RDP_USER
          $password = $env:RDP_PASS
          
          $uLen = if ($username) { $username.Length } else { 0 }
          $pLen = if ($password) { $password.Length } else { 0 }
          
          Write-Host "RDP_USER length: $uLen"
          Write-Host "RDP_PASS length: $pLen"
          
          if ($uLen -eq 0) {
            Write-Error "RDP_USERNAME secret is empty or missing. Check the secret name exactly."
            exit 1
          }
          if ($pLen -eq 0) {
            Write-Error "RDP_PASSWORD secret is empty or missing. Check the secret name exactly."
            exit 1
          }
          
          $securePass = ConvertTo-SecureString $password -AsPlainText -Force
          if (-not (Get-LocalUser -Name $username -ErrorAction SilentlyContinue)) {
              New-LocalUser -Name $username -Password $securePass -AccountNeverExpires
              Add-LocalGroupMember -Group "Administrators" -Member $username
              Add-LocalGroupMember -Group "Remote Desktop Users" -Member $username
          } else {
              Set-LocalUser -Name $username -Password $securePass
          }
          echo "RDP_CREDS=Credentials set securely via Secrets" >> $env:GITHUB_ENV

      - name: Install Tailscale
        run: |
          $tsUrl = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"
          $installerPath = "$env:TEMP\tailscale.msi"
          Invoke-WebRequest -Uri $tsUrl -OutFile $installerPath
          Start-Process msiexec.exe -ArgumentList "/i", "`"$installerPath`"", "/quiet", "/norestart" -Wait
          Remove-Item $installerPath -Force

      - name: Establish Tailscale Connection
        run: |
          $env:Path += ";C:\Program Files\Tailscale"
          tailscale up --authkey=${{ secrets.TAILSCALE_AUTHKEY }} --hostname=gh-runner-$env:GITHUB_RUN_ID --accept-routes
          $tsIP = $null
          $retries = 0
          while (-not $tsIP -and $retries -lt 10) {
              $tsIP = tailscale ip -4
              Start-Sleep -Seconds 5
              $retries++
          }
          if (-not $tsIP) {
              Write-Error "Tailscale IP not assigned. Exiting."
              exit 1
          }
          echo "TAILSCALE_IP=$tsIP" >> $env:GITHUB_ENV

      - name: Enable Audio Services and RDP Audio Redirection
        shell: powershell
        run: |
          Set-Service -Name AudioSrv -StartupType Automatic
          Set-Service -Name AudioEndpointBuilder -StartupType Automatic
          Start-Service -Name AudioEndpointBuilder
          Start-Service -Name AudioSrv
          $policyPath = "HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services"
          if (!(Test-Path $policyPath)) { New-Item -Path $policyPath -Force | Out-Null }
          Set-ItemProperty -Path $policyPath -Name "fDisableAudioCapture" -Value 0 -Type DWord
          Set-ItemProperty -Path $policyPath -Name "fAllowSoundRedirection" -Value 1 -Type DWord
          $rdpTcpPath = "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp"
          Set-ItemProperty -Path $rdpTcpPath -Name "fDisableAudioCapture" -Value 0 -Type DWord
          Restart-Service -Name TermService -Force

      - name: Verify RDP Accessibility
        run: |
          Write-Host "Tailscale IP: $env:TAILSCALE_IP"
          $testResult = Test-NetConnection -ComputerName $env:TAILSCALE_IP -Port 3389
          if (-not $testResult.TcpTestSucceeded) {
              Write-Error "TCP connection to RDP port 3389 failed"
              exit 1
          }
          Write-Host "TCP connectivity successful!"

      - name: Maintain Connection
        env:
          RDP_USER: ${{ secrets.RDP_USERNAME }}
        run: |
          Write-Host "`n=== RDP ACCESS ==="
          Write-Host "Address: $env:TAILSCALE_IP"
          Write-Host "Username: $env:RDP_USER"
          Write-Host "Password: [Stored Securely in Secrets]"
          Write-Host "==================`n"
          while ($true) {
              Write-Host "[$(Get-Date)] RDP Active - Use Ctrl+C in workflow to terminate"
              Start-Sleep -Seconds 300
          }
